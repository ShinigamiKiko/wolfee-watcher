{{- if .Values.sentryAudit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-audit
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: sentry-audit
spec:
  replicas: {{ .Values.sentryAudit.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-audit
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: sentry-audit
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sentry-audit
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
        - name: wolfee-ca-bundle
          configMap:
            name: {{ include "kvisior.caBundleName" . }}
      containers:
        - name: sentry-audit
          image: "{{ include "kvisior.image" .Values.sentryAudit.image }}"
          imagePullPolicy: {{ .Values.sentryAudit.image.pullPolicy }}
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
            - containerPort: 8080
              name: api
              protocol: TCP
          volumeMounts:
            - name: wolfee-ca-bundle
              mountPath: /etc/wolfee-watcher/ca-bundle
              readOnly: true
          env:
            - name: CERT_SERVER_ADDR
              value: {{ .Values.global.certServerAddr | quote }}
            - name: MTLS_CA_FILE
              value: /etc/wolfee-watcher/ca-bundle/ca.crt
            - name: MTLS_REQUIRED
              value: {{ .Values.global.mtlsRequired | quote }}
            - name: SENTRY_ROLES
              value: "webhook"
            - name: KVISIOR_URL
              value: "http://kvisior-ui.{{ include "kvisior.namespace" . }}.svc.cluster.local:80"
            - name: KVISIOR_PUSH_URL
              value: "http://kvisior-ui.{{ include "kvisior.namespace" . }}.svc.cluster.local:80"
            - name: INTERNAL_PUSH_SECRET
              value: {{ .Values.global.internalPushSecret | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.global.clusterId | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sentryAudit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sentry-audit
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: sentry-audit
spec:
  selector:
    app.kubernetes.io/name: sentry-audit
  ports:
    - name: webhook
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: api
      port: 8080
      targetPort: 8080
      protocol: TCP
{{- if gt (int .Values.sentryAudit.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentry-audit
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-audit
{{- end }}
{{- if .Values.sentryAudit.auditLog.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentry-audit-logtail
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: sentry-audit-logtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-audit-logtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-audit-logtail
    spec:
      serviceAccountName: sentry-audit
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- range .Values.sentryAudit.auditLog.nodeLabels }}
              - matchExpressions:
                  - key: {{ . | quote }}
                    operator: Exists
              {{- end }}
      tolerations:
        {{- toYaml .Values.sentryAudit.auditLog.tolerations | nindent 8 }}
      volumes:
        - name: wolfee-ca-bundle
          configMap:
            name: {{ include "kvisior.caBundleName" . }}
        - name: audit-log
          hostPath:
            path: {{ dir .Values.sentryAudit.auditLog.path | quote }}
            type: DirectoryOrCreate
        - name: tail-state
          hostPath:
            path: {{ .Values.sentryAudit.auditLog.stateDir | quote }}
            type: DirectoryOrCreate
      containers:
        - name: logtail
          image: "{{ include "kvisior.image" .Values.sentryAudit.image }}"
          imagePullPolicy: {{ .Values.sentryAudit.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: api
              protocol: TCP
          volumeMounts:
            - name: wolfee-ca-bundle
              mountPath: /etc/wolfee-watcher/ca-bundle
              readOnly: true
            - name: audit-log
              mountPath: {{ dir .Values.sentryAudit.auditLog.path | quote }}
              readOnly: true
            - name: tail-state
              mountPath: /var/lib/sentry-audit
          env:
            - name: SENTRY_ROLES
              value: "logtail"
            - name: AUDIT_LOG_PATH
              value: {{ .Values.sentryAudit.auditLog.path | quote }}
            - name: AUDIT_LOG_STATE_DIR
              value: /var/lib/sentry-audit
            {{- with .Values.sentryAudit.auditLog.dropResources }}
            - name: AUDIT_LOG_DROP_RESOURCES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.sentryAudit.auditLog.dropUsers }}
            - name: AUDIT_LOG_DROP_USERS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: CERT_SERVER_ADDR
              value: {{ .Values.global.certServerAddr | quote }}
            - name: MTLS_CA_FILE
              value: /etc/wolfee-watcher/ca-bundle/ca.crt
            - name: MTLS_REQUIRED
              value: {{ .Values.global.mtlsRequired | quote }}
            - name: KVISIOR_PUSH_URL
              value: "http://kvisior-ui.{{ include "kvisior.namespace" . }}.svc.cluster.local:80"
            - name: INTERNAL_PUSH_SECRET
              value: {{ .Values.global.internalPushSecret | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.global.clusterId | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sentryAudit.auditLog.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
{{- end }}
