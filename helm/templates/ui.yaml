{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvisior-ui
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: kvisior-ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kvisior-ui
  template:
    metadata:
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "8080"
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,9092,9095"
      labels:
        app.kubernetes.io/name: kvisior-ui
    spec:
      serviceAccountName: kvisior
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      initContainers:
        {{- include "kvisior.waitForDeps" . | nindent 8 }}
        {{- include "kvisior.waitForSchema" (dict "ctx" . "creds" .Values.postgres.serviceCredentials.ui) | nindent 8 }}
      volumes:
        - name: wolfee-ca-bundle
          configMap:
            name: {{ include "kvisior.caBundleName" . }}
        {{- if and .Values.postgres.external.enabled .Values.postgres.external.caBundle }}
        - name: postgres-ca
          configMap:
            name: postgres-ca
        {{- end }}
        {{- if .Values.ui.federation.nodePort }}
        - name: federation-tls
          secret:
            secretName: {{ .Values.ui.federation.tlsSecret }}
        {{- end }}
      containers:
        - name: ui
          image: "{{ include "kvisior.image" .Values.ui.image }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            {{- if .Values.ui.federation.nodePort }}
            - containerPort: 8443
              name: federation
              protocol: TCP
            {{- end }}
              protocol: TCP
          volumeMounts:
            - name: wolfee-ca-bundle
              mountPath: /etc/wolfee-watcher/ca-bundle
              readOnly: true
            {{- if and .Values.postgres.external.enabled .Values.postgres.external.caBundle }}
            - name: postgres-ca
              mountPath: /etc/wolfee-watcher/pg-ca
              readOnly: true
            {{- end }}
            {{- if .Values.ui.federation.nodePort }}
            - name: federation-tls
              mountPath: /etc/wolfee-watcher/federation-tls
              readOnly: true
            {{- end }}
          env:
            - name: KVISIOR_ADDR
              value: ":8080"
            - name: APP_VERSION
              value: {{ .Values.ui.appVersion | default .Chart.AppVersion | quote }}
            - name: POSTGRES_DSN
              value: {{ include "kvisior.serviceDSN" (dict "ctx" . "creds" .Values.postgres.serviceCredentials.ui) | quote }}
            {{- if .Values.ui.controlPlaneDSN }}
            - name: POSTGRES_CONTROL_DSN
              value: {{ .Values.ui.controlPlaneDSN | quote }}
            {{- end }}
            - name: KVISIOR_CLUSTER_ID
              value: {{ .Values.global.clusterId | quote }}
            - name: KVISIOR_TRUST_CLUSTER_HEADER
              value: {{ .Values.global.trustClusterHeader | quote }}
            {{- if .Values.global.federationToken }}
            - name: KVISIOR_FEDERATION_TOKEN
              value: {{ .Values.global.federationToken | quote }}
            - name: KVISIOR_ADVERTISE_URL
              value: {{ include "kvisior.advertiseURL" . | quote }}
            {{- end }}
            {{- include "kvisior.clusterEnv" . | nindent 12 }}
            - name: CERT_SERVER_ADDR
              value: {{ .Values.global.certServerAddr | quote }}
            - name: MTLS_CA_FILE
              value: /etc/wolfee-watcher/ca-bundle/ca.crt
            - name: MTLS_REQUIRED
              value: {{ .Values.global.mtlsRequired | quote }}
            - name: INTERNAL_PUSH_SECRET
              value: {{ .Values.global.internalPushSecret | quote }}
            - name: INTEGRATIONS_ALLOW_INTERNAL
              value: {{ .Values.global.integrations.allowInternal | quote }}
            - name: INTEGRATIONS_ALLOWED_CIDRS
              value: {{ .Values.global.integrations.allowedCIDRs | quote }}
            - name: KVISIOR_SECURE_COOKIE
              value: {{ .Values.ui.secureCookie | default "false" | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            {{- if .Values.ui.federation.nodePort }}
            - name: KVISIOR_TLS_ADDR
              value: ":8443"
            - name: KVISIOR_TLS_CERT_FILE
              value: /etc/wolfee-watcher/federation-tls/tls.crt
            - name: KVISIOR_TLS_KEY_FILE
              value: /etc/wolfee-watcher/federation-tls/tls.key
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kvisior-ui
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: kvisior-ui
spec:
  selector:
    app.kubernetes.io/name: kvisior-ui
  ports:
    - name: http
      port: {{ .Values.ui.servicePort }}
      targetPort: 8080
      protocol: TCP
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvisior-ui
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    {{- if .Values.ui.ingress.denyInternalPaths }}
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* ^/internal(/|$) {
        return 403;
      }
    {{- end }}
    {{- with .Values.ui.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- if .Values.ui.ingress.tls }}
  tls:
    {{- toYaml .Values.ui.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kvisior-ui
                port:
                  number: {{ .Values.ui.servicePort }}
{{- end }}
{{- end }}
{{- if and .Values.ui.enabled .Values.ui.federation.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: kvisior-federation
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: kvisior-ui
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: kvisior-ui
  ports:
    - name: federation
      port: 8443
      targetPort: 8443
      nodePort: {{ .Values.ui.federation.nodePort }}
      protocol: TCP
{{- end }}
