{{- if .Values.scannerAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-agent
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: scanner-agent
spec:
  replicas: {{ .Values.scannerAgent.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner-agent
    spec:
      serviceAccountName: scanner-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      {{- with .Values.scannerAgent.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scanner-agent
          image: "{{ include "kvisior.image" .Values.scannerAgent.image }}"
          imagePullPolicy: {{ .Values.scannerAgent.image.pullPolicy }}
          ports:
            - containerPort: 9090
              name: https
              protocol: TCP
          env:
            - name: SCANNER_ADDR
              value: ":9090"
            - name: TRIVY_CACHE_DIR
              value: "/trivy-cache"
            - name: XDG_CACHE_HOME
              value: "/trivy-cache"
            - name: HOME
              value: "/trivy-cache"
            - name: SCANNER_SKIP_DB_WARMUP
              value: "true"
            - name: TRIVY_SKIP_VERSION_CHECK
              value: "true"
            - name: SCANNER_DB_REFRESH_INTERVAL
              value: {{ .Values.scannerAgent.dbRefreshInterval | default "24h" | quote }}
            - name: TRIVY_JAVA_DB
              value: {{ .Values.scannerAgent.javaDB | default false | quote }}
            {{- with .Values.scannerAgent.dbRepository }}
            - name: TRIVY_DB_REPOSITORY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.scannerAgent.javaDBRepository }}
            - name: TRIVY_JAVA_DB_REPOSITORY
              value: {{ . | quote }}
            {{- end }}
            - name: CERT_SERVER_ADDR
              value: {{ .Values.global.certServerAddr | quote }}
            - name: MTLS_REQUIRED
              value: {{ .Values.global.mtlsRequired | quote }}
            - name: KVISIOR_URL
              value: "http://kvisior-ui.{{ include "kvisior.namespace" . }}.svc.cluster.local:80"
            - name: INTERNAL_PUSH_SECRET
              value: {{ .Values.global.internalPushSecret | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.global.clusterId | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCAN_WORKSPACE_DIR
              value: "/scan-workspace"
            {{- if .Values.scannerAgent.bdu.enabled }}
            {{- if .Values.scannerAgent.bdu.archiveURL }}
            - name: BDU_ARCHIVE_URL
              value: {{ .Values.scannerAgent.bdu.archiveURL | quote }}
            {{- end }}
            {{- else }}
            - name: BDU_DISABLE
              value: "1"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.scannerAgent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-agent
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: scanner-agent
spec:
  selector:
    app.kubernetes.io/name: scanner-agent
  ports:
    - name: https
      port: 9090
      targetPort: 9090
      protocol: TCP
{{- end }}
