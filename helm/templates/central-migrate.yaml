{{- if .Values.centralMigrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: central-migrate-r{{ .Release.Revision }}
  namespace: {{ include "kvisior.namespace" . }}
  labels:
    {{- include "kvisior.labels" . | nindent 4 }}
    app.kubernetes.io/name: central-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: central-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      {{- if and .Values.postgres.external.enabled .Values.postgres.external.caBundle }}
      volumes:
        - name: postgres-ca
          configMap:
            name: postgres-ca
      {{- end }}
      containers:
        - name: migrate
          image: "{{ include "kvisior.image" .Values.centralMigrate.image }}"
          imagePullPolicy: {{ .Values.centralMigrate.image.pullPolicy }}
          env:
            - name: POSTGRES_DSN
              value: {{ .Values.global.postgresDSN | default (include "kvisior.directDSN" (dict "ctx" . "creds" (dict "user" .Values.postgres.user "password" .Values.postgres.password))) | quote }}
            - name: EXPECTED_SCHEMA_VERSION
              value: {{ .Values.centralMigrate.schemaVersion | quote }}
            {{- with .Values.centralMigrate.adminBootstrapPassword }}
            - name: ADMIN_BOOTSTRAP_PASSWORD
              value: {{ . | quote }}
            {{- end }}
            - name: SERVICE_DB_PASSWORD_UI
              value: {{ .Values.postgres.serviceCredentials.ui.password | quote }}
            - name: SERVICE_DB_PASSWORD_TRACEE_BRIDGE
              value: {{ .Values.postgres.serviceCredentials.traceeBridge.password | quote }}
            - name: SERVICE_DB_PASSWORD_ANOMALY
              value: {{ .Values.postgres.serviceCredentials.anomaly.password | quote }}
          {{- if and .Values.postgres.external.enabled .Values.postgres.external.caBundle }}
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/wolfee-watcher/pg-ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.centralMigrate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
